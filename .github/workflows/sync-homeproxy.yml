name: sync packages homeproxy

on:
  schedule:
    - cron: '25 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    uses: ./.github/workflows/_Sync.yml
    with:
      upstream: https://github.com/XiaoHaiSly/luci-app-homeproxy
      packages: |
        luci-app-homeproxy
        hiddify-core
